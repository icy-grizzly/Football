<!DOCTYPE html>
<html lang="ms">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>Liga Sukan: Malaysia Edition</title>
 <style>
 * {
   box-sizing: border-box;
   user-select: none;
   -webkit-user-select: none;
 }

 body {
 margin: 0;
 padding: 0;
 background-color: #1a252f;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 height: 100vh;
 font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
 color: white;
 overflow: hidden;
 }

 /* Overlay Screens (Mode, Menu, Club Selection) */
 .overlay-screen {
 position: fixed;
 top: 0; left: 0; width: 100%; height: 100%;
 background: rgba(15, 23, 42, 0.95);
 z-index: 999;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 padding: 20px;
 text-align: center;
 }

 .screen-title {
 font-size: 28px;
 margin-bottom: 20px;
 text-transform: uppercase;
 letter-spacing: 2px;
 text-shadow: 0 2px 4px rgba(0,0,0,0.5);
 }

 .menu-grid {
 display: flex;
 flex-direction: column;
 gap: 15px;
 width: 100%;
 max-width: 320px;
 }

 .menu-btn {
 background: #34495e;
 border: 2px solid #5d6d7e;
 color: white;
 padding: 15px 20px;
 font-size: 18px;
 font-weight: bold;
 border-radius: 10px;
 cursor: pointer;
 transition: all 0.2s;
 }

 .menu-btn:active, .menu-btn:hover {
 background: #27ae60;
 border-color: #2ecc71;
 transform: scale(1.02);
 }

 .club-grid {
 display: grid;
 grid-template-columns: repeat(3, 1fr);
 gap: 15px;
 margin-top: 15px;
 max-width: 600px;
 width: 100%;
 }

 .club-card {
 background: #34495e;
 padding: 15px 10px;
 border-radius: 10px;
 cursor: pointer;
 text-align: center;
 border: 2px solid transparent;
 }

 .club-card:active {
 transform: scale(1.05);
 background: #2c3e50;
 border-color: #fff;
 }

 .club-icon {
 width: 45px;
 height: 45px;
 border-radius: 50%;
 margin: 0 auto 8px;
 display: flex;
 align-items: center;
 justify-content: center;
 font-weight: bold;
 font-size: 16px;
 color: white;
 }

 #game-container {
 position: relative;
 box-shadow: 0 10px 30px rgba(0,0,0,0.5);
 border: 3px solid #fff;
 border-radius: 4px;
 width: 800px;
 max-width: 100vw;
 aspect-ratio: 8/5;
 }

 canvas {
 display: block;
 width: 100%;
 height: 100%;
 background-color: #27ae60;
 }

 #ui-layer {
 position: absolute;
 top: 10px;
 width: 100%;
 text-align: center;
 pointer-events: none;
 text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
 z-index: 5;
 }

 .score-board {
 font-size: 18px;
 font-weight: bold;
 letter-spacing: 2px;
 background: rgba(0,0,0,0.5);
 padding: 4px 12px;
 border-radius: 20px;
 display: inline-block;
 }

 #message {
 position: absolute;
 top: 50%;
 left: 50%;
 transform: translate(-50%, -50%);
 font-size: 22px;
 background: rgba(0, 0, 0, 0.95);
 padding: 20px;
 border-radius: 10px;
 display: none;
 text-align: center;
 z-index: 100;
 border: 3px solid white;
 cursor: pointer;
 width: 80%;
 }

 /* --- MOBILE CONTROLS --- */
 #controls {
 position: absolute;
 bottom: 15px;
 left: 0;
 width: 100%;
 display: none; /* Controlled by JS based on selected mode */
 justify-content: space-between;
 padding: 0 20px;
 pointer-events: none;
 z-index: 50;
 }

 .dpad {
 display: grid;
 grid-template-columns: repeat(3, 50px);
 grid-template-rows: repeat(3, 50px);
 gap: 6px;
 pointer-events: auto;
 }

 .btn {
 background: rgba(255, 255, 255, 0.25);
 border: 2px solid rgba(255, 255, 255, 0.7);
 color: white;
 border-radius: 10px;
 display: flex;
 align-items: center;
 justify-content: center;
 font-weight: bold;
 font-size: 20px;
 touch-action: manipulation;
 }

 .btn:active, .btn.active {
 background: rgba(255, 255, 255, 0.8);
 color: #000;
 }

 #btn-up { grid-column: 2; grid-row: 1; }
 #btn-left { grid-column: 1; grid-row: 2; }
 #btn-right { grid-column: 3; grid-row: 2; }
 #btn-down { grid-column: 2; grid-row: 3; }

 .shoot-zone {
 display: flex;
 align-items: flex-end;
 pointer-events: auto;
 }

 #btn-shoot {
 width: 80px;
 height: 80px;
 border-radius: 50%;
 background: rgba(231, 76, 60, 0.8);
 border: 3px solid white;
 color: white;
 font-weight: bold;
 font-size: 14px;
 display: flex;
 align-items: center;
 justify-content: center;
 text-align: center;
 touch-action: manipulation;
 }

 #btn-shoot:active {
 background: rgba(231, 76, 60, 1);
 transform: scale(0.95);
 }

 @media (max-width: 500px) {
   .club-grid { grid-template-columns: repeat(2, 1fr); }
   .dpad { grid-template-columns: repeat(3, 42px); grid-template-rows: repeat(3, 42px); }
   #btn-shoot { width: 70px; height: 70px; font-size: 12px; }
 }
 </style>
</head>
<body>

 <!-- 1. MODE SELECTION SCREEN -->
 <div id="mode-screen" class="overlay-screen">
   <div class="screen-title">PILIH MOD PERMAINAN</div>
   <div class="menu-grid">
     <button class="menu-btn" onclick="selectMode('pc')">💻 MOD PC (Papan Kekunci)</button>
     <button class="menu-btn" onclick="selectMode('mobile')">📱 MOD MOBILE (Sentuhan)</button>
   </div>
 </div>

 <!-- 2. MAIN MENU SCREEN -->
 <div id="menu-screen" class="overlay-screen" style="display: none;">
   <div class="screen-title">MENU UTAMA</div>
   <div class="menu-grid">
     <button class="menu-btn" onclick="selectMenu('exhibition')">1. EXHIBITION</button>
     <button class="menu-btn" onclick="selectMenu('seasons')">2. SEASONS</button>
     <button class="menu-btn" onclick="selectMenu('myclub')">3. MY CLUB</button>
   </div>
 </div>

 <!-- 3. CLUB SELECTION SCREEN -->
 <div id="club-screen" class="overlay-screen" style="display: none;">
   <div class="screen-title">PILIH KELAB ANDA</div>
   <div class="club-grid" id="club-grid"></div>
 </div>

 <div id="game-container">
 <canvas id="gameCanvas"></canvas>
 
 <div id="ui-layer">
 <div class="score-board">
 <span id="teamP1-name" style="color: #3498db">PASUKAN A</span>: <span id="scoreP1">0</span> 
 - 
 <span id="teamCPU-name" style="color: #e74c3c">PASUKAN B</span>: <span id="scoreCPU">0</span>
 </div>
 </div>

 <div id="message">
 GOL!<br><br>
 <span style="font-size: 14px; background:#27ae60; padding:6px 12px; border-radius:5px;">SENTUH UNTUK MAIN LAGI</span>
 </div>

 <!-- Direct D-Pad Overlay -->
 <div id="controls">
 <div class="dpad">
 <div class="btn" id="btn-up">▲</div>
 <div class="btn" id="btn-left">◄</div>
 <div class="btn" id="btn-right">►</div>
 <div class="btn" id="btn-down">▼</div>
 </div>
 <div class="shoot-zone">
 <div class="btn" id="btn-shoot">TENDANG</div>
 </div>
 </div>
 </div>

<script>
 const clubs = [
 { name: "Johor Darul Ta'zim", short: "JDT", color: "#8B0000", accent: "#FFD700" },
 { name: "Kedah Darul Aman", short: "KDA", color: "#000000", accent: "#FFFF00" },
 { name: "Selangor FC", short: "SLC", color: "#0000CD", accent: "#FFFFFF" },
 { name: "Terengganu FC", short: "TFC", color: "#008000", accent: "#FFFFFF" },
 { name: "Melaka United", short: "MLK", color: "#FF4500", accent: "#000000" },
 { name: "Sabah FC", short: "SBH", color: "#00CED1", accent: "#FFFFFF" }
 ];

 let selectedMode = null; // 'pc' or 'mobile'
 let selectedClub = null;
 let opponentClub = null;

 // --- 1. MODE SELECTION ---
 function selectMode(mode) {
   selectedMode = mode;
   document.getElementById('mode-screen').style.display = 'none';
   document.getElementById('menu-screen').style.display = 'flex';
   
   // Enable mobile controls UI if mobile mode chosen
   if (selectedMode === 'mobile') {
     document.getElementById('controls').style.display = 'flex';
   } else {
     document.getElementById('controls').style.display = 'none';
   }
 }

 // --- 2. MAIN MENU SELECTION ---
 function selectMenu(option) {
   if (option === 'exhibition') {
     document.getElementById('menu-screen').style.display = 'none';
     document.getElementById('club-screen').style.display = 'flex';
   } else if (option === 'seasons') {
     alert("Mod Seasons akan datang tidak lama lagi!");
   } else if (option === 'myclub') {
     alert("Mod My Club akan datang tidak lama lagi!");
   }
 }

 // --- 3. CLUB SELECTION ---
 const clubGrid = document.getElementById('club-grid');
 clubs.forEach((club) => {
 const card = document.createElement('div');
 card.className = 'club-card';
 card.innerHTML = `
 <div class="club-icon" style="background:${club.color}; color:${club.accent}">${club.short}</div>
 <div style="font-size: 13px;">${club.name}</div>
 `;
 card.onclick = () => selectClub(club);
 clubGrid.appendChild(card);
 });

 function selectClub(clubData) {
 selectedClub = clubData;
 let oppIndex;
 do {
 oppIndex = Math.floor(Math.random() * clubs.length);
 } while (clubs[oppIndex] === selectedClub);
 opponentClub = clubs[oppIndex];

 document.getElementById('teamP1-name').innerText = selectedClub.short;
 document.getElementById('teamP1-name').style.color = selectedClub.accent;
 document.getElementById('teamCPU-name').innerText = opponentClub.short;
 document.getElementById('teamCPU-name').style.color = opponentClub.accent;

 // Hide selection screen and start loop
 document.getElementById('club-screen').style.display = 'none';

 resetPositions();
 loop();
 }

 const canvas = document.getElementById('gameCanvas');
 const ctx = canvas.getContext('2d');
 const scoreP1El = document.getElementById('scoreP1');
 const scoreCPUEl = document.getElementById('scoreCPU');
 const msgEl = document.getElementById('message');

 function resizeCanvas() {
 const container = document.getElementById('game-container');
 canvas.width = container.clientWidth;
 canvas.height = container.clientHeight;
 }
 window.addEventListener('resize', resizeCanvas);
 resizeCanvas();

 const FRICTION = 0.88;
 const ACCEL = 1.2;
 let scores = { p1: 0, cpu: 0 };
 let isGameOver = false;

 const inputs = { up: false, down: false, left: false, right: false, shoot: false };

 // Keyboard Control Listeners
 window.addEventListener('keydown', (e) => {
 if (e.code === 'KeyW' || e.code === 'ArrowUp') inputs.up = true;
 if (e.code === 'KeyS' || e.code === 'ArrowDown') inputs.down = true;
 if (e.code === 'KeyA' || e.code === 'ArrowLeft') inputs.left = true;
 if (e.code === 'KeyD' || e.code === 'ArrowRight') inputs.right = true;
 if (e.code === 'Space') inputs.shoot = true;
 });
 window.addEventListener('keyup', (e) => {
 if (e.code === 'KeyW' || e.code === 'ArrowUp') inputs.up = false;
 if (e.code === 'KeyS' || e.code === 'ArrowDown') inputs.down = false;
 if (e.code === 'KeyA' || e.code === 'ArrowLeft') inputs.left = false;
 if (e.code === 'KeyD' || e.code === 'ArrowRight') inputs.right = false;
 if (e.code === 'Space') inputs.shoot = false;
 });

 // Touch D-Pad Control Binding
 function bindBtn(id, key) {
 const el = document.getElementById(id);
 const start = (e) => { e.preventDefault(); inputs[key] = true; el.classList.add('active'); };
 const end = (e) => { e.preventDefault(); inputs[key] = false; el.classList.remove('active'); };

 el.addEventListener('touchstart', start, {passive: false});
 el.addEventListener('touchend', end, {passive: false});
 el.addEventListener('mousedown', start);
 el.addEventListener('mouseup', end);
 }

 bindBtn('btn-up', 'up');
 bindBtn('btn-down', 'down');
 bindBtn('btn-left', 'left');
 bindBtn('btn-right', 'right');
 bindBtn('btn-shoot', 'shoot');

 const ball = { x: 0, y: 0, radius: 10, vx: 0, vy: 0 };
 const player = { x: 0, y: 0, radius: 18, vx: 0, vy: 0 };
 const cpu = { x: 0, y: 0, radius: 18, vx: 0, vy: 0 };
 const goals = { height: 120, y: 0 };

 function resetPositions() {
 ball.x = canvas.width / 2;
 ball.y = canvas.height / 2;
 ball.vx = 0; ball.vy = 0;

 player.x = 100;
 player.y = canvas.height / 2;
 player.vx = 0; player.vy = 0;

 cpu.x = canvas.width - 100;
 cpu.y = canvas.height / 2;
 cpu.vx = 0; cpu.vy = 0;

 goals.y = (canvas.height / 2) - 60;
 }

 function updatePhysics(entity) {
 entity.x += entity.vx;
 entity.y += entity.vy;

 if (entity.x - entity.radius < 0) { entity.x = entity.radius; entity.vx *= -0.5; }
 if (entity.x + entity.radius > canvas.width) { entity.x = canvas.width - entity.radius; entity.vx *= -0.5; }
 if (entity.y - entity.radius < 0) { entity.y = entity.radius; entity.vy *= -0.5; }
 if (entity.y + entity.radius > canvas.height) { entity.y = canvas.height - entity.radius; entity.vy *= -0.5; }
 }

 function checkCollision(p, b) {
 const dx = b.x - p.x;
 const dy = b.y - p.y;
 const dist = Math.sqrt(dx * dx + dy * dy);

 if (dist < p.radius + b.radius) {
 const angle = Math.atan2(dy, dx);
 const power = inputs.shoot && p === player ? 8 : 4;
 
 b.vx = Math.cos(angle) * power + p.vx;
 b.vy = Math.sin(angle) * power + p.vy;

 const overlap = (p.radius + b.radius) - dist;
 b.x += Math.cos(angle) * overlap;
 b.y += Math.sin(angle) * overlap;
 }
 }

 function handleInput() {
 if (inputs.up) player.vy -= ACCEL;
 if (inputs.down) player.vy += ACCEL;
 if (inputs.left) player.vx -= ACCEL;
 if (inputs.right) player.vx += ACCEL;

 player.vx *= FRICTION;
 player.vy *= FRICTION;
 }

 function updateAI() {
 const dx = ball.x - cpu.x;
 const dy = ball.y - cpu.y;
 const dist = Math.sqrt(dx*dx + dy*dy);

 if (dist > 5) {
 cpu.vx += (dx / dist) * 0.5;
 cpu.vy += (dy / dist) * 0.5;
 }
 cpu.vx *= FRICTION;
 cpu.vy *= FRICTION;
 }

 msgEl.addEventListener('click', restartGame);
 msgEl.addEventListener('touchstart', restartGame);

 function restartGame(e) {
 if (e) e.preventDefault();
 if (isGameOver) {
 isGameOver = false;
 msgEl.style.display = 'none';
 resetPositions();
 }
 }

 function update() {
 if (isGameOver) return;

 handleInput();
 updateAI();

 ball.vx *= 0.96;
 ball.vy *= 0.96;

 updatePhysics(player);
 updatePhysics(cpu);
 updatePhysics(ball);

 checkCollision(player, ball);
 checkCollision(cpu, ball);

 if (ball.x < 15 && ball.y > goals.y && ball.y < goals.y + goals.height) {
 scores.cpu++;
 scoreCPUEl.innerText = scores.cpu;
 triggerGoal(false);
 } else if (ball.x > canvas.width - 15 && ball.y > goals.y && ball.y < goals.y + goals.height) {
 scores.p1++;
 scoreP1El.innerText = scores.p1;
 triggerGoal(true);
 }
 }

 function triggerGoal(isPlayer) {
 isGameOver = true;
 msgEl.innerHTML = `GOL UNTUK ${isPlayer ? selectedClub.short : opponentClub.short}!<br><br><span style="font-size:14px; background:#27ae60; padding:6px 12px; border-radius:5px;">SENTUH UNTUK MAIN LAGI</span>`;
 msgEl.style.display = 'block';
 }

 function draw() {
 ctx.fillStyle = '#27ae60';
 ctx.fillRect(0, 0, canvas.width, canvas.height);

 ctx.strokeStyle = '#fff';
 ctx.lineWidth = 2;
 ctx.beginPath();
 ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height);
 ctx.stroke();

 ctx.strokeRect(0, goals.y, 15, goals.height);
 ctx.strokeRect(canvas.width - 15, goals.y, 15, goals.height);

 // Draw Player
 ctx.beginPath();
 ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
 ctx.fillStyle = selectedClub ? selectedClub.color : '#3498db';
 ctx.fill();
 ctx.stroke();

 // Draw CPU
 ctx.beginPath();
 ctx.arc(cpu.x, cpu.y, cpu.radius, 0, Math.PI * 2);
 ctx.fillStyle = opponentClub ? opponentClub.color : '#e74c3c';
 ctx.fill();
 ctx.stroke();

 // Draw Ball
 ctx.beginPath();
 ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
 ctx.fillStyle = '#fff';
 ctx.fill();
 ctx.stroke();
 }

 function loop() {
 update();
 draw();
 requestAnimationFrame(loop);
 }
</script>
</body>
</html>
